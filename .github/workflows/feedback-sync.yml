name: Feedback Ingestion Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Feedback Ingest Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FEEDBACK_IMAP_HOST: ${{ secrets.FEEDBACK_IMAP_HOST }}
          FEEDBACK_IMAP_USER: ${{ secrets.FEEDBACK_IMAP_USER }}
          FEEDBACK_IMAP_PASS: ${{ secrets.FEEDBACK_IMAP_PASS }}
        run: |
          python scripts/kb_ingest.py --all --verbose

      - name: Commit and Push New Feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/02_Tasks/Inbox/
          if git diff --staged --quiet; then
            echo "No new feedback items to commit."
          else
            git commit -m "chore(inbox): ingest new feedback items [skip ci]"
            git push
          fi
