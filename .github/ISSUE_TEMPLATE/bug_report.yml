name: "🐛 Отчет о дефекте (Bug Report)"
description: "Сообщить об ошибке или сбое в работе agent-docs-harness"
title: "[BUG]: "
labels: ["needs-triage", "kind:defect"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшить проект!
        Заполните форму ниже для быстрой обработки дефекта в буфере триажа базы знаний.

  - type: textarea
    id: problem
    attributes:
      label: Описание проблемы
      description: Что именно пошло не так?
      placeholder: При выполнении команды...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Шаги воспроизведения
      description: Последовательность команд или действий для повторения ошибки
      placeholder: |
        1. Запустить '...'
        2. Выбрать пункт '...'
        3. Увидеть ошибку '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти согласно спецификации или здравому смыслу?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение и логи
      description: Текст ошибки, трейсбек или вывод терминала
      render: shell

  - type: input
    id: env
    attributes:
      label: Окружение
      description: ОС, версия Python, используемая IDE/AI-агент
      placeholder: Windows 11 / Python 3.12 / Google Antigravity (Gemini 2.5 Flash)
    validations:
      required: false
